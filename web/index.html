<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backtest Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header>
      <div class="container header-row">
        <h1>Backtest Platform</h1>
        <span class="pill" id="healthPill">Checking API…</span>
      </div>
    </header>

    <main class="container">
      <!-- Backtest Form -->
      <section class="card">
        <h2>Run Backtest</h2>
        <form id="backtestForm" class="form-grid">
          <label>
            <span>Symbol</span>
            <input name="symbol" value="AAPL" required />
          </label>
          <label>
            <span>Strategy</span>
            <select name="strategy" id="strategySelect">
              <option value="buy_and_hold" selected>Buy &amp; Hold</option>
              <option value="sma_crossover">SMA Crossover</option>
              <option value="rsi_mean_reversion">RSI Mean Reversion</option>
            </select>
          </label>
          <label>
            <span>Start Date</span>
            <input name="start_date" type="date" value="2020-01-02" required />
          </label>
          <label>
            <span>End Date</span>
            <input name="end_date" type="date" value="2020-12-31" required />
          </label>
          <label>
            <span>Initial Cash ($)</span>
            <input name="initial_cash" type="number" value="100000" min="1" step="1000" />
          </label>

          <!-- Strategy Parameters (shown dynamically) -->
          <div id="smaParams" class="param-group hidden">
            <label>
              <span>Fast SMA Period</span>
              <input name="fast_period" type="number" value="20" min="2" max="200" />
            </label>
            <label>
              <span>Slow SMA Period</span>
              <input name="slow_period" type="number" value="50" min="5" max="500" />
            </label>
          </div>

          <div id="rsiParams" class="param-group hidden">
            <label>
              <span>RSI Period</span>
              <input name="rsi_period" type="number" value="14" min="2" max="100" />
            </label>
            <label>
              <span>Oversold Threshold</span>
              <input name="oversold" type="number" value="30" min="1" max="49" />
            </label>
            <label>
              <span>Overbought Threshold</span>
              <input name="overbought" type="number" value="70" min="51" max="99" />
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn">Run Backtest</button>
          </div>
        </form>
        <div id="errorBox" class="error-box hidden"></div>
      </section>

      <!-- Results (hidden until backtest completes) -->
      <section id="results" class="hidden">
        <!-- Summary Metrics -->
        <div class="card">
          <h2>Summary</h2>
          <div id="summaryGrid" class="metric-grid"></div>
        </div>

        <!-- Equity Curve -->
        <div class="card">
          <h2>Equity Curve</h2>
          <canvas id="equityChart" height="300"></canvas>
        </div>

        <!-- Trades -->
        <div class="card">
          <h2>Trades</h2>
          <div id="tradesTable"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container muted">
        API: <code>/api/v1</code> · Data: yfinance OHLCV (cached)
      </div>
    </footer>

    <!-- Lightweight chart library (no npm needed) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
